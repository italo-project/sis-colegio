services:
  postgres:
    image: postgres:15-alpine
    container_name: colegios_postgres
    restart: unless-stopped 
    environment:
      POSTGRES_USER: colegios
      POSTGRES_PASSWORD: colegios_dev
      POSTGRES_DB: colegios_saas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colegios"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: colegios_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: